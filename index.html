<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Client Render</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #ffffff;
            --surface-alt: #f8fafc;
            --text: #101828;
            --muted: #475467;
            --border: #dde3ea;
            --accent: #0f766e;
            --accent-soft: rgba(15, 118, 110, 0.12);
            --shadow: 0 16px 40px rgba(16, 24, 40, 0.08);
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(15, 118, 110, 0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(180, 83, 9, 0.08), transparent 24%),
                var(--bg);
            line-height: 1.5;
        }

        * {
            box-sizing: border-box;
        }

        a {
            color: var(--accent);
        }

        a:hover {
            text-decoration: none;
        }

        .app-shell {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            min-height: 100vh;
        }

        .sidebar {
            padding: 24px;
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
        }

        .main {
            padding: 24px;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 20px;
        }

        .search-wrap {
            width: auto;
            margin-left: auto;
        }

        .search-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 999px;
            width: 46px;
            height: 46px;
            padding: 0;
            font: inherit;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.92);
            color: var(--text);
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .search-button svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            white-space: nowrap;
        }

        .search-button:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .search-panel {
            position: fixed;
            top: 92px;
            right: 24px;
            width: min(520px, calc(100vw - 48px));
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: var(--shadow);
            z-index: 30;
        }

        .search-panel[hidden] {
            display: none;
        }

        .search-panel__label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: 8px;
        }

        #searchInput {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 14px 18px;
            font: inherit;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow);
        }

        #searchInput:focus {
            outline: 2px solid var(--accent-soft);
            border-color: var(--accent);
        }

        .brand,
        .sidebar-section {
            width: 100%;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .sidebar-section {
            background: rgba(255, 255, 255, 0.8);
        }

        .brand__logo {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--accent);
            background: var(--accent-soft);
            margin-bottom: 14px;
        }

        .brand__name {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .brand__description {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .sidebar-nav {
            display: grid;
            gap: 14px;
        }

        .sidebar-section__heading {
            margin-bottom: 12px;
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .sidebar-section__list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 8px;
        }

        .sidebar-section__list a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            transition: background 0.15s ease, color 0.15s ease;
        }

        .sidebar-section__list a:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .sidebar-section__list a.is-active,
        .sidebar-section__more.is-active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 700;
        }

        .sidebar-section__more {
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        #content {
            display: grid;
            gap: 18px;
        }

        .hero,
        .article-view,
        .index-panel,
        .card-grid,
        .index-list {
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.82);
            box-shadow: var(--shadow);
        }

        .hero {
            padding: 24px;
        }

        .hero__actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }

        .hero--compact {
            padding-bottom: 18px;
        }

        .hero h1,
        .section-heading h1,
        .article-view__header h1 {
            margin: 0 0 10px;
            font-size: clamp(1.7rem, 2.6vw, 2.7rem);
            line-height: 1.05;
            letter-spacing: -0.03em;
        }

        .hero p,
        .section-heading p,
        .article-view__summary {
            margin: 0;
            color: var(--muted);
        }

        .card-grid {
            padding: 18px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 18px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(248, 250, 252, 0.92));
        }

        .post-card__header {
            display: grid;
            gap: 10px;
        }

        .post-card__title {
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.25;
        }

        .post-card__title a,
        .index-list__title {
            color: var(--text);
            text-decoration: none;
        }

        .post-card__meta,
        .article-view__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge,
        .tag-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 6px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            text-decoration: none;
        }

        .badge {
            background: #eef2ff;
            color: #3730a3;
        }

        .badge--category {
            background: #ecfdf3;
            color: #027a48;
        }

        .badge--date {
            background: #fff7ed;
            color: #b45309;
        }

        .post-card__summary {
            margin: 0;
            color: var(--muted);
        }

        .post-card__footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .post-card__tags,
        .article-view__tags {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .tag-pill {
            border: 0;
            background: transparent;
            color: var(--accent);
            padding: 0;
        }

        .read-more {
            font-weight: 700;
            text-decoration: none;
        }

        .article-view {
            padding: 24px;
        }

        .article-view__header {
            display: grid;
            gap: 14px;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .markdown-body {
            color: var(--text);
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin: 1.4em 0 0.5em;
            line-height: 1.15;
        }

        .markdown-body p,
        .markdown-body ul,
        .markdown-body ol,
        .markdown-body blockquote,
        .markdown-body pre {
            margin: 0 0 1em;
        }

        .markdown-body pre {
            overflow: auto;
            padding: 16px;
            border-radius: 14px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .index-panel {
            padding: 22px;
        }

        .index-list {
            padding: 0;
            overflow: hidden;
        }

        .index-list__item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }

        .index-list__item:first-child {
            border-top: 0;
        }

        .index-list__title {
            font-weight: 700;
        }

        .index-list__meta {
            color: var(--muted);
        }

        .empty-state {
            padding: 18px;
            color: var(--muted);
        }

        @media (max-width: 1024px) {
            .app-shell {
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid var(--border);
            }
        }

        @media (max-width: 720px) {

            .main,
            .sidebar {
                padding: 16px;
            }

            .search-panel {
                top: 78px;
                right: 16px;
                width: calc(100vw - 32px);
            }

            .topbar {
                margin-bottom: 16px;
            }

            .card-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Content navigation">Loading navigation...</aside>
        <main class="main">
            <header class="topbar">
                <div class="search-wrap">
                    <button id="searchButton" class="search-button" type="button" aria-expanded="false"
                        aria-controls="searchPanel" aria-label="Search">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <circle cx="11" cy="11" r="7"></circle>
                            <line x1="16.65" y1="16.65" x2="21" y2="21"></line>
                        </svg>
                        <span class="sr-only">Search</span>
                    </button>
                </div>
            </header>
            <div id="searchPanel" class="search-panel" hidden>
                <div class="search-panel__label">Search all markdown content</div>
                <input id="searchInput" type="search" placeholder="Search titles, summaries, tags, and body text"
                    autocomplete="off">
            </div>
            <div id="content">Loading...</div>
        </main>
    </div>

    <!-- markdown-it from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
