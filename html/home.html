<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    
    <style>
        :root {
            --bg: #f4f1ea;
            --surface: #ffffff;
            --text: #101828;
            --muted: #475467;
            --border: #dde3ea;
            --accent: #0f766e;
            --accent-soft: rgba(15,118,110,0.12);
            --shadow: 0 16px 40px rgba(16,24,40,0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(15,118,110,0.12), transparent 30%),
                radial-gradient(circle at bottom right, rgba(180,83,9,0.08), transparent 24%),
                var(--bg);
            line-height: 1.6;
        }
        a { color: var(--accent); }
        a:hover { text-decoration: none; }

        .page-wrap {
            max-width: 820px;
            margin: 0 auto;
            padding: 32px 24px 64px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 28px;
            font-size: 0.95rem;
        }

        .article {
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(255,255,255,0.88);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .article-hero-img {
            width: 100%;
            max-height: 360px;
            object-fit: cover;
            display: block;
        }

        .article__inner {
            padding: 32px;
        }

        .article__header {
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border);
        }

        .article__title {
            margin: 0 0 14px;
            font-size: clamp(1.7rem, 2.6vw, 2.7rem);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .article__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 5px 10px;
            font-size: 0.8rem;
            font-weight: 700;
            background: #eef2ff;
            color: #3730a3;
        }
        .badge--category { background: #ecfdf3; color: #027a48; }
        .badge--date     { background: #fff7ed; color: #b45309; }

        .article__tags {
            font-size: 0.9rem;
            color: var(--muted);
        }
        .tag-pill { color: var(--accent); font-weight: 600; text-decoration: none; }
        .tag-pill:hover { text-decoration: underline; }

        /* Markdown body */
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
            margin: 1.4em 0 0.5em; line-height: 1.15;
        }
        .markdown-body p, .markdown-body ul, .markdown-body ol,
        .markdown-body blockquote, .markdown-body pre { margin: 0 0 1em; }
        .markdown-body pre {
            overflow: auto; padding: 16px; border-radius: 14px;
            background: #0f172a; color: #e2e8f0;
        }
        .markdown-body code { font-family: Consolas, "Fira Code", monospace; font-size: 0.92em; }
        .markdown-body blockquote {
            border-left: 4px solid var(--accent-soft);
            padding-left: 16px;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <a class="back-link" href="../index.html">← Back to Blog</a>
        <article class="article">
            <img class="article-hero-img" src="https://via.placeholder.com/400x200?text=Welcome" alt="Home">
            <div class="article__inner">
                <header class="article__header">
                    <h1 class="article__title">Home</h1>
                    <div class="article__meta">
                
                    </div>
                    
                </header>
                <div class="markdown-body">
<h1>Welcome</h1>
<p>This Markdown is loaded <strong>dynamically</strong> from the client side! 🚀
this is test content</p>

                </div>
            </div>
        </article>
    </div>
</body>
</html>
